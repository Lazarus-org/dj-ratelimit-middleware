[tox]
requires =
    tox>=4.16
# Django 6.0+ requires Python 3.12+. Django 5.2 also supports Python 3.10/3.11.
env_list =
    py314-django61-drf318
    py314-django60-drf318
    py314-django52-drf318
    py313-django61-drf318
    py313-django60-drf318
    py313-django52-drf318
    py312-django61-drf318
    py312-django60-drf318
    py312-django52-drf318
    py311-django52-drf318
    py310-django52-drf318
    py310-django52-drfmin
    py314-django61-drfmin

[testenv]
description = Run the full Django/ASGI/DRF test suite for one supported compatibility point
package = editable
extras =
    redis
    drf
deps =
    pytest>=8.3
    pytest-asyncio>=0.25
    pytest-cov>=5
    pytest-django>=4.8
    fakeredis[lua]>=2.23
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
    drf318: djangorestframework>=3.18,<3.19
    drfmin: djangorestframework==3.18.3
    pymemcache>=4
pass_env =
    RATELIMIT_TEST_REDIS_URL
    RATELIMIT_TEST_REDIS5_URL
    RATELIMIT_TEST_MEMCACHED_URL
set_env =
    COVERAGE_FILE = {env_dir}/.coverage
commands =
    pytest --cov=ratelimit_middleware --cov-report=xml:{env_dir}/coverage.xml --cov-report=term-missing

[testenv:bandit]
description = Run security checks on the package source
skip_install = true
deps =
    bandit[toml]>=1.8
commands =
    bandit -c pyproject.toml -r ratelimit_middleware

[testenv:pre-commit]
description = Run the non-mutating CI pre-commit checks
skip_install = true
deps =
    pre-commit>=4.0
    ruff>=0.11
    bandit[toml]>=1.8
commands =
    pre-commit run --all-files --config .pre-commit-config-ci.yaml
