repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: ruff check ratelimit_middleware tests scripts
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: Ruff formatting
        entry: ruff format --check ratelimit_middleware tests scripts
        language: system
        pass_filenames: false
        always_run: true
      - id: bandit
        name: Bandit package audit
        entry: bandit -c pyproject.toml -r ratelimit_middleware
        language: system
        pass_filenames: false
        always_run: true
      - id: python-compile
        name: Compile package Python modules
        entry: python -m compileall -q ratelimit_middleware
        language: system
        pass_filenames: false
        always_run: true
