name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Validate tag and build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate distribution metadata and release tag
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python scripts/check_packaging.py --tag "$RELEASE_TAG"
          else
            python scripts/check_packaging.py
          fi
      - name: Build wheel and source distribution
        run: uv build --force-pep517
      - name: Inspect wheel
        run: python scripts/check_wheel.py dist/
      - name: Verify distribution metadata and README rendering
        run: uvx --from 'twine==6.2.0' twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error

  test-release:
    name: Full release validation
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: [verify-and-build, test-release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist
      - name: Publish using PyPI Trusted Publisher
        uses: pypa/gh-action-pypi-publish@release/v1
