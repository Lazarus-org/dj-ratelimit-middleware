[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-ratelimit-middleware"
version = "0.1.0"
description = "Redis-backed Django and ASGI rate limit middleware"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Django>=4.2",
    "redis>=5.0",
    "asgiref>=3.7",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "fakeredis>=2.23",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
include = ["ratelimit_middleware*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
