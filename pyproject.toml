[build-system]
requires = ["uv-build>=0.12.9,<0.14"]
build-backend = "uv_build"

[project]
name = "dj-ratelimit-middleware"
version = "1.0.0"
description = "Configurable Django Cache and Redis rate limiting for Django and ASGI applications"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["django", "asgi", "rate-limiting", "redis", "security", "middleware"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "Django>=5.2,<6.2; python_version>='3.12'",
    "Django>=5.2,<6; python_version<'3.12'",
    "asgiref>=3.8.1",
]

[project.urls]
Source = "https://github.com/Lazarus-org/dj-ratelimit-middleware"
Issues = "https://github.com/Lazarus-org/dj-ratelimit-middleware/issues"
Changelog = "https://github.com/Lazarus-org/dj-ratelimit-middleware/blob/main/CHANGELOG.md"

[project.optional-dependencies]
redis = ["redis>=5.0"]
drf = ["djangorestframework>=3.18.3"]
test = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "fakeredis[lua]>=2.23",
    "pytest-asyncio>=0.23",
    "djangorestframework>=3.18.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "fakeredis[lua]>=2.23",
    "pytest-asyncio>=0.23",
    "djangorestframework>=3.18.3",
    "pytest-cov>=5.0",
    "ruff>=0.11",
    "bandit[toml]>=1.8",
    "pre-commit>=4.0",
    "commitizen>=4.0",
]

[tool.uv.build-backend]
module-name = "ratelimit_middleware"
module-root = ""

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
norecursedirs = [".venv", ".tox", "build", "dist", "kernel"]

[tool.coverage.run]
source = ["ratelimit_middleware"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["kernel", "ratelimit_middleware/migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.bandit]
exclude_dirs = ["tests", "kernel", "ratelimit_middleware/migrations"]
targets = ["ratelimit_middleware"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "1.0.0"
version_files = ["pyproject.toml:version"]
tag_format = "v$version"
